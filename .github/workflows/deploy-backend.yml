name: Deploy Backend (Railway)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

# One deploy at a time per branch/PR; newer pushes cancel in-flight runs.
concurrency:
  group: railway-backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint "{src,test}/**/*.ts"

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  migrate-neon:
    name: Migrate & seed (Neon)
    # Only main / manual runs migrations; PRs stop after the verify job.
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          DB_SSL: 'true'
        run: npm run migration:run:prod

      - name: Seed database
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          DB_SSL: 'true'
        run: npm run seed

  deploy:
    name: Deploy to Railway
    # Only main / manual runs deploy; PRs stop after the verify job.
    if: github.event_name != 'pull_request'
    needs: migrate-neon
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy
        env:
          # Project token (Project Settings -> Tokens). Scopes the CLI to one
          # project + environment, so no `railway link` is needed.
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --ci --service "${{ vars.RAILWAY_SERVICE || 'backend' }}"

      - name: Job summary
        run: |
          {
            echo "### Backend deployed to Railway"
            echo ""
            echo "- Service: \`${{ vars.RAILWAY_SERVICE || 'backend' }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
